name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (no signing)
        run: |
          xcodebuild -project Cicada.xcodeproj -target Cicada \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""

      - name: Ad-hoc sign (helps TrollStore install)
        run: |
          codesign --force --sign - --timestamp=none \
            build/derived/Build/Products/Release-iphoneos/Cicada.app || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/derived/Build/Products/Release-iphoneos/Cicada.app Payload/
          zip -r Cicada.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Cicada-ipa
          path: Cicada.ipa
          if-no-files-found: error
